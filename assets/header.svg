<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Khayden Chetty — Application Developer. Software, Automation, Systems.">
  <title>Khayden Chetty — Application Developer</title>

  <defs>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFF0"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#FF00FF"/>
    </linearGradient>

    <linearGradient id="ruleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00FFF0" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#00FFF0" stop-opacity="1"/>
      <stop offset="50%"  stop-color="#8B5CF6" stop-opacity="1"/>
      <stop offset="75%"  stop-color="#FF00FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF00FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#00FFF0" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00FFF0" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00FFF0" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="45%" r="72%">
      <stop offset="0%"   stop-color="#0B1220" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#05070A" stop-opacity="1"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262D" stroke-width="1" opacity="0.55"/>
    </pattern>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="typeClip">
      <rect x="344" y="244" width="0" height="28">
        <animate attributeName="width"
                 values="0;320;320;0;0"
                 keyTimes="0;0.35;0.85;0.95;1"
                 dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }

    @keyframes namePulse {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 0.95; }
    }
    @keyframes blink {
      0%, 45%   { opacity: 1; }
      50%, 95%  { opacity: 0; }
      100%      { opacity: 1; }
    }
    @keyframes drift {
      from { transform: translate(0, 0); }
      to   { transform: translate(40px, 40px); }
    }
    @keyframes sweep {
      0%   { transform: translateY(-40px); }
      100% { transform: translateY(300px); }
    }
    @keyframes bracketIn {
      0%, 100% { opacity: 0.35; }
      50%      { opacity: 0.9; }
    }

    .glowLayer { animation: namePulse 4s ease-in-out infinite; }
    .cursor    { animation: blink 1.1s steps(1) infinite; }
    .gridDrift { animation: drift 8s linear infinite; }
    .scanline  { animation: sweep 7s linear infinite; }
    .bracket   { animation: bracketIn 4s ease-in-out infinite; }
  </style>

  <!-- backdrop -->
  <rect width="1000" height="300" fill="#05070A"/>
  <rect width="1000" height="300" fill="url(#vignette)"/>
  <g clip-path="inset(0)">
    <rect class="gridDrift" x="-40" y="-40" width="1080" height="380" fill="url(#grid)"/>
  </g>

  <!-- scanline sweep -->
  <rect class="scanline" x="0" y="0" width="1000" height="40" fill="url(#scanGrad)"/>

  <!-- corner brackets -->
  <g class="bracket" stroke="#00FFF0" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 24 58 L 24 24 L 58 24"/>
    <path d="M 942 24 L 976 24 L 976 58"/>
    <path d="M 976 242 L 976 276 L 942 276"/>
    <path d="M 58 276 L 24 276 L 24 242"/>
  </g>

  <!-- prompt -->
  <text class="mono" x="500" y="76" text-anchor="middle" font-size="14" fill="#7D8590" letter-spacing="2">
    khayden@github:~$ whoami
  </text>

  <!-- name -->
  <g filter="url(#glow)" class="glowLayer">
    <text class="mono" x="500" y="150" text-anchor="middle" font-size="52" font-weight="700"
          fill="url(#nameGrad)" letter-spacing="4">KHAYDEN CHETTY</text>
  </g>
  <text class="mono" x="500" y="150" text-anchor="middle" font-size="52" font-weight="700"
        fill="url(#nameGrad)" letter-spacing="4">KHAYDEN CHETTY</text>

  <!-- animated rule -->
  <rect x="230" y="170" width="540" height="1.5" fill="url(#ruleGrad)"/>

  <!-- role -->
  <text class="mono" x="500" y="206" text-anchor="middle" font-size="19" font-weight="600"
        fill="#00FFF0" letter-spacing="7" filter="url(#softGlow)">APPLICATION DEVELOPER</text>

  <!-- pillars -->
  <text class="mono" x="500" y="232" text-anchor="middle" font-size="13" fill="#7D8590" letter-spacing="4">
    SOFTWARE &#183; AUTOMATION &#183; SYSTEMS
  </text>

  <!-- typing line -->
  <text class="mono" x="332" y="265" text-anchor="end" font-size="13" fill="#8B5CF6">&gt;</text>
  <g clip-path="url(#typeClip)">
    <text class="mono" x="344" y="265" font-size="13" fill="#E6EDF3">building things that solve real problems</text>
  </g>
  <rect class="cursor" x="344" y="254" width="8" height="14" fill="#00FFF0">
    <animate attributeName="x"
             values="344;664;664;344;344"
             keyTimes="0;0.35;0.85;0.95;1"
             dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>
